services:
  - type: web
    name: doctodata
    runtime: python
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: glm-4-flash
      - key: LLM_VISION_MODEL
        value: glm-4v-flash
